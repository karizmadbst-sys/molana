<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#060a12" />
    <link rel="manifest" href="./manifest.json" />
    <title>ECHO – THE WORLD REMEMBERS</title>
    <meta name="description" content="A mystical 3D third-person adventure and exploration game across the Forgotten Island with procedural terrain, ancient temples, bioluminescent lakes, and magical echo crystals." />
    <meta property="og:title" content="ECHO – THE WORLD REMEMBERS" />
    <meta property="og:description" content="A mystical 3D third-person adventure and exploration game across the Forgotten Island with procedural terrain, ancient temples, bioluminescent lakes, and magical echo crystals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #060a12;
        color: #ffffff;
        overflow: hidden;
      }
      #echo-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        background: radial-gradient(circle at center, #0e1e2d 0%, #060a12 100%);
        color: #e0fbf6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #echo-boot-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-title {
        font-size: clamp(2.1rem, 6vw, 3.6rem);
        font-weight: 800;
        letter-spacing: 0.35rem;
        color: #70e1ff;
        text-shadow: 0 0 24px rgba(0, 245, 212, 0.55);
      }
      .boot-sub {
        font-size: 0.9rem;
        letter-spacing: 0.14rem;
        color: #94d2bd;
        opacity: 0.9;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <div id="echo-boot-splash" aria-hidden="true">
        <div class="boot-title">ECHO</div>
        <div class="boot-sub">THE WORLD REMEMBERS · جارٍ تحضير العالم</div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
